name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this pipeline only reads the repo and uploads an artifact.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validation Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Run Format Check
        id: format
        continue-on-error: true
        run: pnpm exec prettier --check .

      - name: Run Unit Tests
        id: test
        continue-on-error: true
        run: pnpm run test:ci

      - name: Run Build
        id: build
        continue-on-error: true
        run: pnpm run build

      - name: Run Audit
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Upload Build Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

      - name: Generate CI Summary Report
        if: always()
        run: |
          get_result() {
            if [ "$1" = "success" ]; then
              echo "✅ Passed"
            else
              echo "❌ Failed"
            fi
          }

          LINT_RES=$(get_result "${{ steps.lint.outcome }}")
          FORMAT_RES=$(get_result "${{ steps.format.outcome }}")
          TEST_RES=$(get_result "${{ steps.test.outcome }}")
          BUILD_RES=$(get_result "${{ steps.build.outcome }}")
          AUDIT_RES=$(get_result "${{ steps.audit.outcome }}")

          if [ "${{ steps.lint.outcome }}" = "success" ] && \
             [ "${{ steps.format.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ] && \
             [ "${{ steps.build.outcome }}" = "success" ] && \
             [ "${{ steps.audit.outcome }}" = "success" ]; then
            STATUS_LINE="🟢 **All checks passed**"
          else
            STATUS_LINE="🔴 **Some checks failed**"
          fi

          echo "## 🏁 GPA Dashboard CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$STATUS_LINE · Commit \`${{ github.sha }}\` · Workflow run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Result | What it verifies |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **Lint** | $LINT_RES | Static analysis and code-quality rules |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 **Format** | $FORMAT_RES | Consistent repository formatting |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Unit tests** | $TEST_RES | Behavior and unit test assertions |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Build** | $BUILD_RES | Production PWA compilation |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Audit** | $AUDIT_RES | Dependency security vulnerabilities |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Build Artifact" >> $GITHUB_STEP_SUMMARY
            echo "A production-ready build has been zipped and uploaded. You can download the **production-build** bundle from the **Artifacts** section at the bottom of this run summary page." >> $GITHUB_STEP_SUMMARY
          fi

          node .github/workflows/parse-test-results.cjs

      - name: Set Workflow Exit Status
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.format.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "CI pipeline checks failed. Exiting with error."
            exit 1
          fi
